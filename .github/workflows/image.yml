name: Image bauen

# Baut das Image bei jedem Push auf main. Die Version kommt aus umbrel-app.yml;
# für ein Update reicht es, sie dort (und an den zwei anderen Stellen) anzuheben.
on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "tests/**"
      - "lighthouse-netzlaufwerk-waechter/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Version prüfen
        id: version
        run: |
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' lighthouse-netzlaufwerk-waechter/umbrel-app.yml)"
          echo "Version laut umbrel-app.yml: ${version}"
          test -n "${version}"
          grep -q "netzlaufwerk-waechter:${version}\$" lighthouse-netzlaufwerk-waechter/docker-compose.yml \
            || { echo "docker-compose.yml verweist nicht auf Image-Tag ${version}"; exit 1; }
          grep -q "^VERSION = \"${version}\"\$" image/waechter.py \
            || { echo "VERSION in image/waechter.py ist nicht ${version}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/netzlaufwerk-waechter
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
